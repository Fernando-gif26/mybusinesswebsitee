<!DOCTYPE html>
<html>
<head>
    <title>Login - Bean & Bliss Cafe</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Logo / Image -->
    <img src="img logo/file_00000000a56881f8adff0634371ed34a.png" class="login-logo">

    <!-- Footer / Cafe Information -->
    <div class="login-footer">
        <h2>☕ Bean & Bliss Cafe</h2>
    </div>

    <!-- Login Box -->
    <form>

        <h1>Login</h1>

        <label for="username">Username:</label>
        <input 
            type="text" 
            id="username" 
            placeholder="Enter username"
        >

        <br><br>

        <label for="password">Password:</label>
        <input 
            type="password" 
            id="password" 
            placeholder="Enter password"
        >

        <br><br>

        <button> 
             <a href="home page.html">log-in</a>
        </button>

    </form>

</body>
</html>
